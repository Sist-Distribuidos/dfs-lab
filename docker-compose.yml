services:
  node1:
    image: gluster/gluster-centos
    container_name: node1
    privileged: true
    networks:
      - glusternet
    volumes:
      - data1:/data/brick1
    hostname: node1
  node2:
    image: gluster/gluster-centos
    container_name: node2
    privileged: true
    networks:
      - glusternet
    volumes:
      - data2:/data/brick1
    hostname: node2
  client:
    image: centos:7
    container_name: client
    privileged: true
    networks:
      - glusternet
    depends_on:
      - node1
      - node2
    tty: true
    command: sleep infinity
networks:
  glusternet:
    driver: bridge
volumes:
  data1:
  data2:
