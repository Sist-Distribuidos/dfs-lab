services:
  node1:
    image: gluster/gluster-centos
    container_name: node1
    privileged: true
    networks:
      - glusternet
    volumes:
      - data1:/data/brick1
    hostname: node1
    
  node2:
    image: gluster/gluster-centos
    container_name: node2
    privileged: true
    networks:
      - glusternet
    volumes:
      - data2:/data/brick1
    hostname: node2
    
  node3:
    image: gluster/gluster-centos
    container_name: node3
    privileged: true
    networks:
      - glusternet
    volumes:
      - data3:/data/brick1
    hostname: node3
    
  client:
    image: centos:7
    container_name: client
    privileged: true
    networks:
      - glusternet
    depends_on:
      - node1
      - node2
      - node3
    tty: true
    command: sleep infinity
    
  client2:
    image: centos:7
    container_name: client2
    privileged: true
    networks:
      - glusternet
    depends_on:
      - node1
      - node2
      - node3
    tty: true
    command: sleep infinity
    
  web:
    image: nginx:latest
    container_name: web
    privileged: true
    ports:
      - "8080:80"
    networks:
      - glusternet
    volumes:
      - ./nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    command: sleep infinity

  web2:
    image: nginx:latest
    container_name: web2
    privileged: true
    ports:
      - "8081:80"
    networks:
      - glusternet
    volumes:
      - ./nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    command: sleep infinity

networks:
  glusternet:
    driver: bridge

volumes:
  data1:
  data2:
  data3: